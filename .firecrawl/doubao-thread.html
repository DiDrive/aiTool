接传过去，或者你们API支持base64的话直接传base64\\\\n\\\\n### 步骤2：加「循环等待节点」（轮询生成进度）\\\\n因为视频生成是异步的，提交后需要等结果：\\\\n1. 从提交接口返回里取 `task_id`\\\\n2. 每10秒调用一次「查询进度接口」\\\\n3. 判断状态：成功就往下走，失败就触发重试，超时就标记失败\\\\n4. 重试逻辑：失败自动重跑2次，和之前的规则一致\\\\n\\\\n### 步骤3：加「文件下载节点」（拉取生成好的视频）\\\\n1. 生成成功后从返回的 `video_url` 下载视频文件\\\\n2. 按 `video_id_镜头号.mp4` 命名，存到对应文件夹\\\\n3. 自动对接后面的「镜头拼接节点」，后续流程完全不用改\\\\n\\\\n### 步骤4：适配批量并发\\\\n1. 保留原来的并发控制：测试1并发、首批20并发、批量15并发\\\\n2. 如果你们加白API有QPS限制，在HTTP节点里加个限流延迟，比如每秒最多提交5个任务，避免被拦截\\\\n\\\\n---\\\\n\\\\n## 三、和现有工作流的适配说明\\\\n| 原有环节 | 是否需要改动 | 说明 |\\\\n|----------|--------------|------|\\\\n| CSV读取 + 批量生成提示词 | ❌ 不改 | 完全复用，生成的提示词直接喂给HTTP节点 |\\\\n| 视频生成 | ✅ 替换为HTTP节点 | 唯一改动的地方，换成你们的加白API |\\\\n| 镜头拼接+加BGM+音效 | ❌ 不改 | 生成完视频直接进后期流水线，逻辑全保留 |\\\\n| 尾帧拼接+归档+分阶段跑 | ❌ 不改 | 三阶段流程、命名规则、失败标记全部不变 |\\\\n\\\\n---\\\\n\\\\n## 四、常见问题处理\\\\n### 1. 参考图怎么传给API？\\\\n- 如果API支持公网URL：Codex里可以直接获取资源库文件的临时访问链接，动态填到请求体里\\\\n- 如果API只支持base64：加一个「图片转base64」的代码节点，转完再传\\\\n\\\\n### 2. 球星形象会不会被拦截？\\\\n不会，你们的API是已经加白授权过的，走你们自己的接口通道，不受默认内容审核限制，只要提示词里正常用球星参考图就行。\\\\n\\\\n### 3. 配置难度大吗？\\\\n全程可视化拖拽，不用写代码，只要把API参数填对就行，正常15分钟就能配完接入。如果有接口文档，直接对着文档填字段，10分钟搞定。\\\\n\\\\n---\\\\n\\\\n## 五、你现在需要做的\\\\n1. 找技术\\u002FAPI提供方拿到上面列的5个API信息\\\\n2. 把信息对着填到Codex的HTTP请求节点里\\\\n3. 先跑测试条（第9号）验证生成是否正常\\\\n4. 没问题就按原计划跑20条首批+80条批量，全流程自动跑\\\\n\\\\n如果拿到API文档后不确定怎么填，可以把文档发过来，我给你写好直接能用的请求配置。\\\&quot;}},\\\&quot;is_finish\\\&quot;:true}]\&quot;,\&quot;content_status\&quot;:0,\&quot;index_in_conv\&quot;:\&quot;102\&quot;,\&quot;create_time\&quot;:\&quot;1783475197\&quot;,\&quot;msg_hint_info\&quot;:null,\&quot;sec_sender\&quot;:\&quot;MS4wLjABAAAA3Msx91dgLGoJV54FJ5m8ld2t7SnJ5NRH0jZ0ZBvtwnsEVST4qssz2tlaPp-u0lYD\&quot;,\&quot;thinking_content\&quot;:\&quot;\&quot;,\&quot;content_block\&quot;:[{\&quot;block_type\&quot;:10040,\&quot;block_id\&quot;:\&quot;f1d46e34-1e33-477d-bbd4-8e510f012bf9\&quot;,\&quot;parent_id\&quot;:\&quot;\&quot;,\&quot;content\&quot;:{\&quot;suggest_block\&quot;:null,\&quot;search_text_block\&quot;:null,\&quot;search_engine_bl
